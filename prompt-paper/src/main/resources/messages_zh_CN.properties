prompt.timed_out=<red>提示已超时。</red>
prompt.error.invalid_title_filter=<red>提示配置无效：TITLE 过滤器不能用于非复合标签。</red>
prompt.error.command_failed=<red>命令执行失败：%message%</red>
validation.invalid_integer=<red>请输入一个有效的整数。</red>
validation.invalid_string=<red>输入内容不能为空。</red>
validation.answer_too_long=<red>输入内容超过了最大长度 %max% 个字符。</red>
