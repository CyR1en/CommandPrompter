# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - 迁移 V2 提示语法 | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>用法：/cmdp migrate [--dry-run] [path]。路径相对于 plugins/；按 TAB 可补全文件夹和文件。 | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>你没有迁移文件的权限。</red>
command.migrate.started=<gray>正在检查 %path% 中的旧版提示...</gray>
command.migrate.nothing=<yellow>%path% 中没有需要迁移的内容。未创建备份，也未修改文件。</yellow>
command.migrate.manual=<yellow>有 %count% 个问题需要手动处理。文件未修改。最多显示 20 个问题：</yellow>
command.migrate.preview=<gray>将迁移 %path% 中的 %count% 个提示。未写入任何文件。最多显示 20 项更改：</gray>
command.migrate.change=<gray>第 %line% 行：%before% → %after%</gray>
command.migrate.success=<green>已迁移 %path% 中的 %count% 个提示。</green>
command.migrate.backup=<gray>备份：%path%</gray>
command.migrate.reload=<gray>准备就绪后，请重新加载此配置所属的插件。</gray>
command.migrate.issue.malformed=<red>第 %line% 行：旧版提示未闭合或格式错误。</red>
command.migrate.issue.ambiguous=<red>第 %line% 行：语法或转义存在歧义，请手动转换此提示。</red>
command.migrate.issue.unsupported=<red>第 %line% 行：不支持的旧版提示类型、选项或玩家过滤器。</red>
command.migrate.issue.invalid=<red>第 %line% 行：转换后的提示未通过 V3 验证，请手动检查。</red>
command.migrate.error.busy=<red>此文件正在迁移中。请在完成后重试。</red>
command.migrate.error.not_found=<red>所选文件不存在。</red>
command.migrate.error.unsupported_file=<red>请选择 UTF-8 文本配置文件；二进制文件、备份和临时文件不在范围内。</red>
command.migrate.error.invalid_path=<red>路径无效。请使用 plugins/ 下的文件；不允许上级目录跳转、符号链接或迁移备份。</red>
command.migrate.error.too_large=<red>文件超过了 8 MiB 的迁移大小限制。</red>
command.migrate.error.read_failed=<red>无法读取文件。请检查权限和服务器日志。</red>
command.migrate.error.backup_failed=<red>无法创建备份。原文件未修改。请查看服务器日志。</red>
command.migrate.error.changed=<red>文件在迁移期间发生了更改。未替换文件；请等待其他写入完成后重试。</red>
command.migrate.error.write_failed=<red>无法以原子方式替换文件。原文件未被替换，备份已保留。请查看服务器日志。</red>
command.migrate.error.unexpected=<red>迁移失败。请在重试前查看服务器日志。</red>
command.migrate.undo.usage=<gray>用法：/cmdp migrate undo [backup]。按 TAB 浏览 migration-backups/。先备份当前文件，再恢复所选备份。</gray>
command.migrate.undo.started=<gray>正在恢复备份 %path%...</gray>
command.migrate.undo.nothing=<yellow>%path% 已与此备份一致。未修改文件，也未创建新备份。</yellow>
command.migrate.undo.success=<green>已恢复 %path%。之前的内容已备份。</green>
command.migrate.undo.hint=<gray>恢复此备份：/cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>备份路径无效。请按 TAB 选择 migration-backups/ 内的文件；不允许上级目录跳转或符号链接。</red>
