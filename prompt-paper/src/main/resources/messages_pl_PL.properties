# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - Migracja składni monitów V2 | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>Użycie: /cmdp migrate [--dry-run] [path]. Ścieżki względem plugins/; TAB uzupełnia foldery i pliki. | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>Nie masz uprawnień do migracji plików.</red>
command.migrate.started=<gray>Wyszukiwanie starych monitów w %path%...</gray>
command.migrate.nothing=<yellow>Brak elementów do migracji w %path%. Nie utworzono kopii ani nie wprowadzono zmian.</yellow>
command.migrate.manual=<yellow>%count% problemów wymaga ręcznej kontroli. Plik pozostał bez zmian. Wyświetlono maksymalnie 20 problemów:</yellow>
command.migrate.preview=<gray>Migracja objęłaby %count% monitów w %path%. Nie zapisano plików. Wyświetlono maksymalnie 20 zmian:</gray>
command.migrate.change=<gray>Wiersz %line%: %before% → %after%</gray>
command.migrate.success=<green>Zmigrowano %count% monitów w %path%.</green>
command.migrate.backup=<gray>Kopia zapasowa: %path%</gray>
command.migrate.reload=<gray>Gdy będziesz gotowy, przeładuj plugin, do którego należy ta konfiguracja.</gray>
command.migrate.issue.malformed=<red>Wiersz %line%: Niezamknięty lub nieprawidłowy stary monit.</red>
command.migrate.issue.ambiguous=<red>Wiersz %line%: Niejednoznaczna składnia lub sekwencja ucieczki; przekonwertuj monit ręcznie.</red>
command.migrate.issue.unsupported=<red>Wiersz %line%: Nieobsługiwany stary typ monitu, opcja lub filtr graczy.</red>
command.migrate.issue.invalid=<red>Wiersz %line%: Przekonwertowany monit nie przeszedł walidacji V3; sprawdź go ręcznie.</red>
command.migrate.error.busy=<red>Ten plik jest już migrowany. Spróbuj ponownie po zakończeniu.</red>
command.migrate.error.not_found=<red>Wybrany plik nie istnieje.</red>
command.migrate.error.unsupported_file=<red>Wybierz tekstowy plik konfiguracji UTF-8; pliki binarne, kopie i pliki tymczasowe są pomijane.</red>
command.migrate.error.invalid_path=<red>Nieprawidłowa ścieżka. Użyj pliku w plugins/; przejścia do katalogów nadrzędnych, dowiązania symboliczne i kopie migracji są wykluczone.</red>
command.migrate.error.too_large=<red>Plik przekracza limit migracji wynoszący 8 MiB.</red>
command.migrate.error.read_failed=<red>Nie można odczytać pliku. Sprawdź uprawnienia i dziennik serwera.</red>
command.migrate.error.backup_failed=<red>Nie można utworzyć kopii zapasowej. Oryginalny plik pozostał bez zmian. Sprawdź dziennik serwera.</red>
command.migrate.error.changed=<red>Plik zmienił się podczas migracji. Nie został zastąpiony; spróbuj ponownie po zakończeniu innych zapisów.</red>
command.migrate.error.write_failed=<red>Nie można atomowo zastąpić pliku. Oryginał nie został zastąpiony; kopia została zachowana. Sprawdź dziennik serwera.</red>
command.migrate.error.unexpected=<red>Migracja nie powiodła się. Przed ponowną próbą sprawdź dziennik serwera.</red>
command.migrate.undo.usage=<gray>Użycie: /cmdp migrate undo [backup]. TAB przegląda migration-backups/. Przywraca wybraną kopię po zapisaniu kopii bieżącego pliku.</gray>
command.migrate.undo.started=<gray>Przywracanie kopii %path%...</gray>
command.migrate.undo.nothing=<yellow>%path% jest już zgodny z tą kopią. Nie wprowadzono zmian ani nie utworzono nowej kopii.</yellow>
command.migrate.undo.success=<green>Przywrócono %path%. Poprzednia zawartość została zachowana w kopii zapasowej.</green>
command.migrate.undo.hint=<gray>Aby przywrócić tę kopię: /cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>Nieprawidłowa ścieżka kopii. Wybierz plik w migration-backups/ klawiszem TAB; ścieżki nadrzędne i dowiązania symboliczne są wykluczone.</red>
