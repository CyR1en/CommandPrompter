prompt.error.command_failed=<red>Wykonanie polecenia nie powiodło się: %message%</red>
validation.invalid_integer=<red>Proszę podać prawidłową liczbę całkowitą.</red>
validation.invalid_string=<red>Pole nie może być puste.</red>
