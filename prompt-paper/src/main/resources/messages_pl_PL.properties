# All values support MiniMessage formatting tags.
# To override, copy this file to plugins/CommandPrompterPaper/locales/messages_pl_PL.properties
# and edit as desired.

prompt.cancelled=<yellow>Prompt anulowany.</yellow>
prompt.timed_out=<red>Czas oczekiwania na prompt minął.</red>
