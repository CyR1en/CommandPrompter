# CommandPrompter messages (pirate)
# All values support MiniMessage formatting tags.
# To override, copy this file to plugins/CommandPrompterPaper/locales/messages_pirate.properties
# and edit as desired.

prompt.cancelled=<yellow>Arrr! The prompt be cancelled.</yellow>
prompt.timed_out=<red>Ye took too long, matey. The prompt has sunk!</red>
prompt.error.invalid_title_filter=<red>Invalid prompt chart: the TITLE filter cannot sail with a non-compound tag.</red>
prompt.error.session_active=<red>Arrr! Ye already have an active prompt voyage.</red>
prompt.error.command_failed=<red>The command ran aground: %message%</red>
validation.invalid_integer=<red>Enter a proper whole number, landlubber.</red>
validation.invalid_string=<red>Ye cannot submit an empty message.</red>
validation.answer_too_long=<red>Yer yarn be too long! Keep it under %max% letters.</red>
player_ui.search_instruction=<gold>Speak yer search words into the chat.</gold>
dialog.no_options=<yellow>No choices be available. Enter the argument by hand.</yellow>
dialog.too_many_options=<yellow>Too many choices aboard (%count%). Enter the argument by hand.</yellow>
command.error.players_only=<red>Only players may cancel prompts, arrr!</red>
command.error.missing_preset=<red>The ship's configuration be missing a required prompt or post-command preset. Check the server console, Captain.</red>
command.error.missing_validator=<red>Avast! An unknown input validator be referenced. Check the ship's log for details.</red>
command.cancel.no_active_prompt=<red>Ye have no active prompt to cancel.</red>
command.delegate.unknown_permission=<red>Unknown permission key: %key%</red>
command.reload.success=<green>The configuration has been reloaded. All hands on deck!</green>
command.reload.failed=<red>The reload ran aground: %error%</red>
command.version=<gold>CommandPrompterPaper v%version% — the finest prompting vessel on the seven seas!</gold>

# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - Bring V2 prompts aboard V3 | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>Usage: /cmdp migrate [--dry-run] [path]. Sail from plugins/; TAB finds folders and files. | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>Ye lack permission to migrate these files.</red>
command.migrate.started=<gray>Searching %path% for old prompts, matey...</gray>
command.migrate.nothing=<yellow>Nothing to migrate in %path%, arr! No backup or changes made.</yellow>
command.migrate.manual=<yellow>%count% trouble(s) need yer eye. The file stays untouched. Showing up to 20 troubles:</yellow>
command.migrate.preview=<gray>Would migrate %count% prompt(s) in %path%. No files written, matey. Showing up to 20 changes:</gray>
command.migrate.change=<gray>Line %line%: %before% → %after%</gray>
command.migrate.success=<green>Migrated %count% prompt(s) in %path%, arr!</green>
command.migrate.backup=<gray>Backup stashed at: %path%</gray>
command.migrate.reload=<gray>Reload the plugin owning this configuration when ye be ready.</gray>
command.migrate.issue.malformed=<red>Line %line%: An old prompt be unclosed or malformed.</red>
command.migrate.issue.ambiguous=<red>Line %line%: Murky syntax or escaping; convert this prompt by hand.</red>
command.migrate.issue.unsupported=<red>Line %line%: Unsupported old prompt type, flag, or player filter, matey.</red>
command.migrate.issue.invalid=<red>Line %line%: Converted prompt failed V3 inspection; check it by hand.</red>
command.migrate.error.busy=<red>This file be migrating already. Wait till the voyage ends.</red>
command.migrate.error.not_found=<red>That file be missing, matey.</red>
command.migrate.error.unsupported_file=<red>Choose a UTF-8 text configuration; binary files, backups, and temporary files stay ashore.</red>
command.migrate.error.invalid_path=<red>Bad course! Use a file under plugins/; no parent traversal, symlinks, or migration backups.</red>
command.migrate.error.too_large=<red>This file exceeds the 8 MiB cargo limit.</red>
command.migrate.error.read_failed=<red>Cannot read the file, arr. Check permissions and the server log.</red>
command.migrate.error.backup_failed=<red>Could not stash the backup. The original stays untouched. Check the server log.</red>
command.migrate.error.changed=<red>The file changed mid-voyage. It was not replaced; retry after other writes finish.</red>
command.migrate.error.write_failed=<red>Could not replace the file atomically. The original was not replaced; the backup stays safe. Check the server log.</red>
command.migrate.error.unexpected=<red>Migration ran aground. Check the server log before sailing again.</red>
command.migrate.undo.usage=<gray>Usage: /cmdp migrate undo [backup]. TAB sails through migration-backups/. Restores yer chosen backup after stashing the current file.</gray>
command.migrate.undo.started=<gray>Restoring backup %path%, matey...</gray>
command.migrate.undo.nothing=<yellow>%path% already matches this backup, arr. No changes or new backup made.</yellow>
command.migrate.undo.success=<green>Restored %path%, arr! The previous contents be safely backed up.</green>
command.migrate.undo.hint=<gray>To restore this treasure: /cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>Bad backup course! Use TAB to choose a file in migration-backups/; no parent traversal or symlinks, matey.</red>
