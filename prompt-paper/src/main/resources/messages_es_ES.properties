# CommandPrompter messages (es_ES)
# All values support MiniMessage formatting tags.
# To override, copy this file to plugins/CommandPrompterPaper/locales/messages_es_ES.properties
# and edit as desired.

prompt.cancelled=<yellow>Prompt cancelado.</yellow>
prompt.timed_out=<red>El prompt ha expirado.</red>
prompt.error.invalid_title_filter=<red>Configuración de prompt inválida: el filtro TITLE no puede usarse en una etiqueta no compuesta.</red>
prompt.error.command_failed=<red>El comando falló: %message%</red>
validation.invalid_integer=<red>Por favor, introduce un número entero válido.</red>
validation.invalid_string=<red>La entrada no puede estar vacía.</red>
validation.answer_too_long=<red>La entrada excede la longitud máxima de %max% caracteres.</red>
player_ui.search_instruction=<gold>Escribe tu término de búsqueda en el chat.</gold>
dialog.no_options=<yellow>No hay opciones disponibles, introduce el argumento manualmente.</yellow>
dialog.too_many_options=<yellow>Demasiadas opciones (%count%), introduce el argumento manualmente.</yellow>
command.error.players_only=<red>Solo los jugadores pueden cancelar prompts.</red>
command.error.missing_preset=<red>Error de configuración: Falta un preset de prompt o comando posterior. Consulta la consola del servidor para más detalles.</red>
command.error.missing_validator=<red>Error de configuración: Se hace referencia a un validador de entrada desconocido. Consulta la consola del servidor para más detalles.</red>
command.cancel.no_active_prompt=<red>No tienes ningún prompt activo.</red>
command.delegate.unknown_permission=<red>Clave de permiso desconocida: %key%</red>
command.reload.success=<green>Configuración recargada.</green>
command.reload.failed=<red>Error al recargar: %error%</red>
command.version=<gold>CommandPrompterPaper v%version%</gold>

# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - Migrar la sintaxis de indicaciones V2 | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>Uso: /cmdp migrate [--dry-run] [path]. Las rutas son relativas a plugins/; TAB completa carpetas y archivos. | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>No tienes permiso para migrar archivos.</red>
command.migrate.started=<gray>Buscando indicaciones antiguas en %path%...</gray>
command.migrate.nothing=<yellow>No hay nada que migrar en %path%. No se crearon copias ni se realizaron cambios.</yellow>
command.migrate.manual=<yellow>%count% problema(s) requieren revisión manual. El archivo no se modificó. Se muestran hasta 20 problemas:</yellow>
command.migrate.preview=<gray>Se migrarían %count% indicación(es) en %path%. No se escribió ningún archivo. Se muestran hasta 20 cambios:</gray>
command.migrate.change=<gray>Línea %line%: %before% → %after%</gray>
command.migrate.success=<green>Se migraron %count% indicación(es) en %path%.</green>
command.migrate.backup=<gray>Copia de seguridad: %path%</gray>
command.migrate.reload=<gray>Recarga el plugin al que pertenece esta configuración cuando estés listo.</gray>
command.migrate.issue.malformed=<red>Línea %line%: Indicación antigua sin cerrar o mal formada.</red>
command.migrate.issue.ambiguous=<red>Línea %line%: Sintaxis o escape ambiguos; convierte esta indicación manualmente.</red>
command.migrate.issue.unsupported=<red>Línea %line%: Tipo de indicación, opción o filtro de jugadores antiguo no compatible.</red>
command.migrate.issue.invalid=<red>Línea %line%: La indicación convertida no supera la validación V3; revísala manualmente.</red>
command.migrate.error.busy=<red>Este archivo ya se está migrando. Inténtalo de nuevo cuando termine.</red>
command.migrate.error.not_found=<red>El archivo seleccionado no existe.</red>
command.migrate.error.unsupported_file=<red>Selecciona un archivo de configuración de texto UTF-8; se excluyen binarios, copias y archivos temporales.</red>
command.migrate.error.invalid_path=<red>Ruta no válida. Usa un archivo dentro de plugins/; se excluyen rutas ascendentes, enlaces simbólicos y copias de migración.</red>
command.migrate.error.too_large=<red>El archivo supera el límite de migración de 8 MiB.</red>
command.migrate.error.read_failed=<red>No se puede leer el archivo. Revisa sus permisos y el registro del servidor.</red>
command.migrate.error.backup_failed=<red>No se pudo crear la copia. El archivo original no se modificó. Consulta el registro del servidor.</red>
command.migrate.error.changed=<red>El archivo cambió durante la migración. No se reemplazó; inténtalo cuando terminen las otras escrituras.</red>
command.migrate.error.write_failed=<red>No se pudo reemplazar el archivo de forma atómica. El original no se reemplazó y la copia se conserva. Consulta el registro del servidor.</red>
command.migrate.error.unexpected=<red>La migración falló. Consulta el registro del servidor antes de reintentar.</red>
command.migrate.undo.usage=<gray>Uso: /cmdp migrate undo [backup]. TAB explora migration-backups/. Restaura la copia seleccionada y guarda primero el archivo actual.</gray>
command.migrate.undo.started=<gray>Restaurando la copia %path%...</gray>
command.migrate.undo.nothing=<yellow>%path% ya coincide con esta copia. No se realizaron cambios ni se creó otra copia.</yellow>
command.migrate.undo.success=<green>Se restauró %path%. Se guardó una copia del contenido anterior.</green>
command.migrate.undo.hint=<gray>Para restaurar esta copia: /cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>Ruta de copia no válida. Selecciona un archivo dentro de migration-backups/ con TAB; no se permiten rutas ascendentes ni enlaces simbólicos.</red>
