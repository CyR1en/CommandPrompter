# CommandPrompter default messages (en_US)
# All values support MiniMessage formatting tags.
# To override, copy this file to plugins/CommandPrompterPaper/locales/messages_en_US.properties
# and edit as desired.

prompt.cancelled=<yellow>Prompt cancelled.</yellow>
prompt.timed_out=<red>Prompt timed out.</red>
prompt.error.invalid_title_filter=<red>Invalid prompt configuration: TITLE filter cannot be used on a non-compound tag.</red>
prompt.error.session_active=<red>You already have an active prompt session.</red>
prompt.error.command_failed=<red>Command failed: %message%</red>
validation.invalid_integer=<red>Please enter a valid integer.</red>
validation.invalid_string=<red>Input cannot be empty.</red>
validation.answer_too_long=<red>Input exceeds maximum length of %max% characters.</red>
player_ui.search_instruction=<gold>Type your search term in chat.</gold>
dialog.no_options=<yellow>No options available, enter argument manually.</yellow>
dialog.too_many_options=<yellow>Too many options (%count%), enter argument manually.</yellow>
command.error.players_only=<red>Only players can cancel prompts.</red>
command.error.missing_preset=<red>Configuration error: A required prompt or post-command preset is missing. See server console for details.</red>
command.error.missing_validator=<red>Configuration error: An unknown input validator is referenced. See server console for details.</red>
command.cancel.no_active_prompt=<red>You have no active prompt.</red>
command.delegate.unknown_permission=<red>Unknown permission key: %key%</red>
command.reload.success=<green>Configuration reloaded.</green>
command.reload.failed=<red>Failed to reload: %error%</red>
command.version=<gold>CommandPrompterPaper v%version%</gold>

# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - Migrate V2 prompt syntax | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>Usage: /cmdp migrate [--dry-run] [path]. Paths are relative to plugins/; TAB completes folders and files. | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>You do not have permission to migrate files.</red>
command.migrate.started=<gray>Checking %path% for legacy prompts...</gray>
command.migrate.nothing=<yellow>Nothing to migrate in %path%. No backup or changes were made.</yellow>
command.migrate.manual=<yellow>%count% issue(s) need manual attention. The file was not changed. Showing up to 20 issues:</yellow>
command.migrate.preview=<gray>Would migrate %count% prompt(s) in %path%. No files written. Showing up to 20 changes:</gray>
command.migrate.change=<gray>Line %line%: %before% → %after%</gray>
command.migrate.success=<green>Migrated %count% prompt(s) in %path%.</green>
command.migrate.backup=<gray>Backup: %path%</gray>
command.migrate.reload=<gray>Reload the plugin that owns this configuration when ready.</gray>
command.migrate.issue.malformed=<red>Line %line%: Unclosed or malformed legacy prompt.</red>
command.migrate.issue.ambiguous=<red>Line %line%: Ambiguous syntax or escaping; convert this prompt manually.</red>
command.migrate.issue.unsupported=<red>Line %line%: Unsupported legacy prompt type, flag, or player filter.</red>
command.migrate.issue.invalid=<red>Line %line%: Converted prompt fails V3 validation; review it manually.</red>
command.migrate.error.busy=<red>This file is already being migrated. Try again when it finishes.</red>
command.migrate.error.not_found=<red>The selected file does not exist.</red>
command.migrate.error.unsupported_file=<red>Select a UTF-8 text configuration file; binary, backup, and temporary files are excluded.</red>
command.migrate.error.invalid_path=<red>Invalid path. Use a file under plugins/; parent traversal, symlinks, and migration backups are excluded.</red>
command.migrate.error.too_large=<red>The file exceeds the 8 MiB migration limit.</red>
command.migrate.error.read_failed=<red>Cannot read the file. Check its permissions and the server log.</red>
command.migrate.error.backup_failed=<red>Could not create the backup. The original file was not changed. See the server log.</red>
command.migrate.error.changed=<red>The file changed during migration. It was not replaced; retry after other writes finish.</red>
command.migrate.error.write_failed=<red>Could not replace the file atomically. The original was not replaced; the backup is retained. See the server log.</red>
command.migrate.error.unexpected=<red>Migration failed. Check the server log before retrying.</red>
command.migrate.undo.usage=<gray>Usage: /cmdp migrate undo [backup]. TAB browses migration-backups/. Restores the selected backup and saves the current file first.</gray>
command.migrate.undo.started=<gray>Restoring backup %path%...</gray>
command.migrate.undo.nothing=<yellow>%path% already matches this backup. No changes or new backup were made.</yellow>
command.migrate.undo.success=<green>Restored %path%. The previous contents were backed up.</green>
command.migrate.undo.hint=<gray>To restore this backup: /cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>Invalid backup path. Select a file inside migration-backups/ using TAB; parent traversal and symlinks are excluded.</red>
