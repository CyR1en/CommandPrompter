# CommandPrompter messages (tl_PH)
# All values support MiniMessage formatting tags.
# To override, copy this file to plugins/CommandPrompterPaper/locales/messages_tl_PH.properties
# and edit as desired.

prompt.cancelled=<yellow>Kinansela ang prompt.</yellow>
prompt.timed_out=<red>Nag-time out ang prompt.</red>
prompt.error.invalid_title_filter=<red>Di-wastong pagsasaayos ng prompt: ang TITLE filter ay hindi maaaring gamitin sa isang hindi compound na tag.</red>
prompt.error.command_failed=<red>Nabigo ang utos: %message%</red>
validation.invalid_integer=<red>Mangyaring magpasok ng tamang integer.</red>
validation.invalid_string=<red>Hindi maaaring walang laman ang input.</red>
validation.answer_too_long=<red>Lumampas ang input sa pinakamataas na haba na %max% character.</red>
player_ui.search_instruction=<gold>I-type ang iyong hinahanap sa chat.</gold>
dialog.no_options=<yellow>Walang available na opsyon, ilagay ang argumento nang manu-mano.</yellow>
dialog.too_many_options=<yellow>Masyadong maraming opsyon (%count%), ilagay ang argumento nang manu-mano.</yellow>
command.error.players_only=<red>Mga manlalaro lamang ang maaaring magkansela ng mga prompt.</red>
command.error.missing_preset=<red>Error sa configuration: May nawawalang prompt o post-command preset. Tingnan ang server console para sa mga detalye.</red>
command.error.missing_validator=<red>Error sa configuration: May tinukoy na hindi kilalang input validator. Tingnan ang server console para sa mga detalye.</red>
command.cancel.no_active_prompt=<red>Wala kang aktibong prompt.</red>
command.delegate.unknown_permission=<red>Hindi kilalang permission key: %key%</red>
command.reload.success=<green>Na-reload ang configuration.</green>
command.reload.failed=<red>Nabigo ang pag-reload: %error%</red>
command.version=<gold>CommandPrompterPaper v%version%</gold>

# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - Ilipat ang V2 prompt syntax | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>Gamit: /cmdp migrate [--dry-run] [path]. Ang mga path ay mula sa plugins/; TAB para kumpletuhin ang mga folder at file. | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>Wala kang pahintulot na mag-migrate ng mga file.</red>
command.migrate.started=<gray>Sinusuri ang %path% para sa mga lumang prompt...</gray>
command.migrate.nothing=<yellow>Walang kailangang i-migrate sa %path%. Walang ginawang backup o pagbabago.</yellow>
command.migrate.manual=<yellow>%count% isyu ang kailangang suriin nang manu-mano. Hindi binago ang file. Hanggang 20 isyu ang ipapakita:</yellow>
command.migrate.preview=<gray>%count% prompt sa %path% ang ima-migrate. Walang isinulat na file. Hanggang 20 pagbabago ang ipapakita:</gray>
command.migrate.change=<gray>Linya %line%: %before% → %after%</gray>
command.migrate.success=<green>Na-migrate ang %count% prompt sa %path%.</green>
command.migrate.backup=<gray>Backup: %path%</gray>
command.migrate.reload=<gray>I-reload ang plugin na may-ari ng configuration na ito kapag handa ka na.</gray>
command.migrate.issue.malformed=<red>Linya %line%: Hindi nakasara o mali ang anyo ng lumang prompt.</red>
command.migrate.issue.ambiguous=<red>Linya %line%: Malabo ang syntax o escape; manu-manong i-convert ang prompt na ito.</red>
command.migrate.issue.unsupported=<red>Linya %line%: Hindi suportadong lumang uri ng prompt, flag, o filter ng manlalaro.</red>
command.migrate.issue.invalid=<red>Linya %line%: Hindi pumasa sa V3 validation ang na-convert na prompt; suriin nang manu-mano.</red>
command.migrate.error.busy=<red>Kasalukuyang mina-migrate ang file na ito. Subukan muli kapag tapos na.</red>
command.migrate.error.not_found=<red>Wala ang napiling file.</red>
command.migrate.error.unsupported_file=<red>Pumili ng UTF-8 text configuration file; hindi kasama ang binary, backup, at pansamantalang file.</red>
command.migrate.error.invalid_path=<red>Di-wastong path. Gumamit ng file sa loob ng plugins/; hindi kasama ang pag-akyat sa parent folder, symlink, at migration backup.</red>
command.migrate.error.too_large=<red>Lampas ang file sa limitasyong 8 MiB para sa migration.</red>
command.migrate.error.read_failed=<red>Hindi mabasa ang file. Suriin ang mga pahintulot at log ng server.</red>
command.migrate.error.backup_failed=<red>Hindi nagawa ang backup. Hindi binago ang orihinal na file. Tingnan ang log ng server.</red>
command.migrate.error.changed=<red>Nagbago ang file habang mina-migrate. Hindi ito pinalitan; subukan muli kapag tapos na ang ibang pagsusulat.</red>
command.migrate.error.write_failed=<red>Hindi mapalitan ang file nang atomiko. Hindi pinalitan ang orihinal; napanatili ang backup. Tingnan ang log ng server.</red>
command.migrate.error.unexpected=<red>Nabigo ang migration. Tingnan ang log ng server bago subukan muli.</red>
command.migrate.undo.usage=<gray>Gamit: /cmdp migrate undo [backup]. TAB para mag-browse sa migration-backups/. Ibinabalik ang napiling backup matapos i-save ang kasalukuyang file.</gray>
command.migrate.undo.started=<gray>Ibinabalik ang backup na %path%...</gray>
command.migrate.undo.nothing=<yellow>Tugma na ang %path% sa backup na ito. Walang pagbabago o bagong backup na ginawa.</yellow>
command.migrate.undo.success=<green>Naibalik ang %path%. Na-backup ang dating nilalaman.</green>
command.migrate.undo.hint=<gray>Para ibalik ang backup na ito: /cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>Di-wastong backup path. Pumili ng file sa migration-backups/ gamit ang TAB; bawal ang pag-akyat sa parent folder at mga symlink.</red>
