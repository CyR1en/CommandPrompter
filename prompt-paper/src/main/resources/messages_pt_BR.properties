# CommandPrompter messages (pt_BR)
# All values support MiniMessage formatting tags.
# To override, copy this file to plugins/CommandPrompterPaper/locales/messages_pt_BR.properties
# and edit as desired.

prompt.cancelled=<yellow>Prompt cancelado.</yellow>
prompt.timed_out=<red>O prompt expirou.</red>
prompt.error.invalid_title_filter=<red>Configuração de prompt inválida: o filtro TITLE não pode ser usado em uma tag não composta.</red>
prompt.error.command_failed=<red>O comando falhou: %message%</red>
validation.invalid_integer=<red>Por favor, insira um número inteiro válido.</red>
validation.invalid_string=<red>A entrada não pode estar vazia.</red>
validation.answer_too_long=<red>A entrada excede o comprimento máximo de %max% caracteres.</red>
player_ui.search_instruction=<gold>Digite seu termo de busca no chat.</gold>
dialog.no_options=<yellow>Nenhuma opção disponível, insira o argumento manualmente.</yellow>
dialog.too_many_options=<yellow>Opções demais (%count%), insira o argumento manualmente.</yellow>
command.error.players_only=<red>Apenas jogadores podem cancelar prompts.</red>
command.error.missing_preset=<red>Erro de configuração: Falta um preset de prompt ou pós-comando necessário. Veja o console do servidor para mais detalhes.</red>
command.error.missing_validator=<red>Erro de configuração: Um validador de entrada desconhecido foi referenciado. Veja o console do servidor para mais detalhes.</red>
command.cancel.no_active_prompt=<red>Você não tem nenhum prompt ativo.</red>
command.delegate.unknown_permission=<red>Chave de permissão desconhecida: %key%</red>
command.reload.success=<green>Configuração recarregada.</green>
command.reload.failed=<red>Falha ao recarregar: %error%</red>
command.version=<gold>CommandPrompterPaper v%version%</gold>

# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - Migrar a sintaxe de prompts V2 | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>Uso: /cmdp migrate [--dry-run] [path]. Caminhos relativos a plugins/; TAB completa pastas e arquivos. | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>Você não tem permissão para migrar arquivos.</red>
command.migrate.started=<gray>Procurando prompts antigos em %path%...</gray>
command.migrate.nothing=<yellow>Nada para migrar em %path%. Nenhum backup ou alteração foi feito.</yellow>
command.migrate.manual=<yellow>%count% problema(s) precisam de revisão manual. O arquivo não foi alterado. Mostrando até 20 problemas:</yellow>
command.migrate.preview=<gray>Seriam migrados %count% prompt(s) em %path%. Nenhum arquivo foi gravado. Mostrando até 20 alterações:</gray>
command.migrate.change=<gray>Linha %line%: %before% → %after%</gray>
command.migrate.success=<green>%count% prompt(s) migrado(s) em %path%.</green>
command.migrate.backup=<gray>Backup: %path%</gray>
command.migrate.reload=<gray>Recarregue o plugin ao qual esta configuração pertence quando estiver pronto.</gray>
command.migrate.issue.malformed=<red>Linha %line%: Prompt antigo não fechado ou malformado.</red>
command.migrate.issue.ambiguous=<red>Linha %line%: Sintaxe ou escape ambíguo; converta este prompt manualmente.</red>
command.migrate.issue.unsupported=<red>Linha %line%: Tipo de prompt, opção ou filtro de jogadores antigo não suportado.</red>
command.migrate.issue.invalid=<red>Linha %line%: O prompt convertido falhou na validação V3; revise-o manualmente.</red>
command.migrate.error.busy=<red>Este arquivo já está sendo migrado. Tente novamente quando terminar.</red>
command.migrate.error.not_found=<red>O arquivo selecionado não existe.</red>
command.migrate.error.unsupported_file=<red>Selecione uma configuração de texto UTF-8; arquivos binários, backups e temporários são excluídos.</red>
command.migrate.error.invalid_path=<red>Caminho inválido. Use um arquivo dentro de plugins/; caminhos para pastas superiores, links simbólicos e backups de migração são excluídos.</red>
command.migrate.error.too_large=<red>O arquivo excede o limite de migração de 8 MiB.</red>
command.migrate.error.read_failed=<red>Não foi possível ler o arquivo. Verifique as permissões e o log do servidor.</red>
command.migrate.error.backup_failed=<red>Não foi possível criar o backup. O arquivo original não foi alterado. Consulte o log do servidor.</red>
command.migrate.error.changed=<red>O arquivo mudou durante a migração. Ele não foi substituído; tente novamente após as outras gravações.</red>
command.migrate.error.write_failed=<red>Não foi possível substituir o arquivo atomicamente. O original não foi substituído; o backup foi mantido. Consulte o log do servidor.</red>
command.migrate.error.unexpected=<red>Falha na migração. Consulte o log do servidor antes de tentar novamente.</red>
command.migrate.undo.usage=<gray>Uso: /cmdp migrate undo [backup]. TAB navega em migration-backups/. Restaura o backup selecionado e salva o arquivo atual primeiro.</gray>
command.migrate.undo.started=<gray>Restaurando o backup %path%...</gray>
command.migrate.undo.nothing=<yellow>%path% já corresponde a este backup. Nenhuma alteração ou novo backup foi feito.</yellow>
command.migrate.undo.success=<green>%path% restaurado. O conteúdo anterior foi salvo em um backup.</green>
command.migrate.undo.hint=<gray>Para restaurar este backup: /cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>Caminho de backup inválido. Selecione um arquivo em migration-backups/ com TAB; caminhos superiores e links simbólicos são excluídos.</red>
