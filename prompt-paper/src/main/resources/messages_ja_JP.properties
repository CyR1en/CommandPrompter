# CommandPrompter messages (ja_JP)
# All values support MiniMessage formatting tags.
# To override, copy this file to plugins/CommandPrompterPaper/locales/messages_ja_JP.properties
# and edit as desired.

prompt.cancelled=<yellow>プロンプトがキャンセルされました。</yellow>
prompt.timed_out=<red>プロンプトがタイムアウトしました。</red>
prompt.error.invalid_title_filter=<red>プロンプト設定が無効です：TITLE フィルターは複合タグ以外には使用できません。</red>
prompt.error.command_failed=<red>コマンドの実行に失敗しました：%message%</red>
validation.invalid_integer=<red>有効な整数を入力してください。</red>
validation.invalid_string=<red>入力内容を空にすることはできません。</red>
validation.answer_too_long=<red>入力が最大文��数（%max%文字）を超えています。</red>
player_ui.search_instruction=<gold>チャットに検索キーワードを入力してください。</gold>
dialog.no_options=<yellow>利用可能な選択肢がありません。引数を手動で入力してください。</yellow>
dialog.too_many_options=<yellow>選択肢が多すぎます（%count%件）。引数を手動で入力してください。</yellow>
command.error.players_only=<red>プロンプトをキャンセルできるのはプレイヤーのみです。</red>
command.error.missing_preset=<red>設定エラー: 必要なプロンプトまたはポストコマンドのプリセットが見つかりません。詳細はサーバーコンソールを確認してください。</red>
command.error.missing_validator=<red>設定エラー: 不明な入力バリデータが参照されています。詳細はサーバーコンソールを確認してください。</red>
