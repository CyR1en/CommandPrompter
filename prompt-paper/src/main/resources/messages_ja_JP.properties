command.reload.failed=<red>再読み込みに失敗しました：%error%</red>
command.version=<gold>CommandPrompterPaper v%version%</gold>

# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - V2プロンプト構文を移行 | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>使い方: /cmdp migrate [--dry-run] [path]。パスはplugins/からの相対パスです。TABでフォルダーとファイルを補完できます。 | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>ファイルを移行する権限がありません。</red>
command.migrate.started=<gray>%path% の旧プロンプトを確認中...</gray>
command.migrate.nothing=<yellow>%path% に移行対象はありません。バックアップ作成も変更も行っていません。</yellow>
command.migrate.manual=<yellow>%count% 件の問題に手動確認が必要です。ファイルは変更していません。最大20件を表示:</yellow>
command.migrate.preview=<gray>%path% の %count% 件のプロンプトが移行対象です。ファイルは書き込んでいません。最大20件の変更を表示:</gray>
command.migrate.change=<gray>%line% 行目: %before% → %after%</gray>
command.migrate.success=<green>%path% の %count% 件のプロンプトを移行しました。</green>
command.migrate.backup=<gray>バックアップ: %path%</gray>
command.migrate.reload=<gray>準備ができたら、この設定を所有するプラグインを再読み込みしてください。</gray>
command.migrate.issue.malformed=<red>%line% 行目: 旧プロンプトが閉じられていないか、形式が不正です。</red>
command.migrate.issue.ambiguous=<red>%line% 行目: 構文またはエスケープが曖昧です。手動で変換してください。</red>
command.migrate.issue.unsupported=<red>%line% 行目: 未対応の旧プロンプト種別、フラグ、またはプレイヤーフィルターです。</red>
command.migrate.issue.invalid=<red>%line% 行目: 変換後のプロンプトがV3の検証に失敗しました。手動で確認してください。</red>
command.migrate.error.busy=<red>このファイルは移行中です。完了後に再試行してください。</red>
command.migrate.error.not_found=<red>選択したファイルは存在しません。</red>
command.migrate.error.unsupported_file=<red>UTF-8のテキスト設定ファイルを選択してください。バイナリ、バックアップ、一時ファイルは対象外です。</red>
command.migrate.error.invalid_path=<red>無効なパスです。plugins/内のファイルを指定してください。親への移動、シンボリックリンク、移行バックアップは対象外です。</red>
command.migrate.error.too_large=<red>ファイルが移行上限の8 MiBを超えています。</red>
command.migrate.error.read_failed=<red>ファイルを読み取れません。権限とサーバーログを確認してください。</red>
command.migrate.error.backup_failed=<red>バックアップを作成できませんでした。元のファイルは変更していません。サーバーログを確認してください。</red>
command.migrate.error.changed=<red>移行中にファイルが変更されました。置き換えていません。他の書き込みが完了したら再試行してください。</red>
command.migrate.error.write_failed=<red>ファイルをアトミックに置き換えられませんでした。元のファイルは置き換えておらず、バックアップは保持されています。サーバーログを確認してください。</red>
command.migrate.error.unexpected=<red>移行に失敗しました。再試行前にサーバーログを確認してください。</red>
command.migrate.undo.usage=<gray>使い方: /cmdp migrate undo [backup]。TABでmigration-backups/を参照できます。現在のファイルを保存してから選択したバックアップを復元します。</gray>
command.migrate.undo.started=<gray>バックアップ %path% を復元中...</gray>
command.migrate.undo.nothing=<yellow>%path% はこのバックアップと一致しています。変更も新しいバックアップの作成も行っていません。</yellow>
command.migrate.undo.success=<green>%path% を復元しました。以前の内容はバックアップに保存されています。</green>
command.migrate.undo.hint=<gray>このバックアップを復元: /cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>無効なバックアップパスです。TABでmigration-backups/内のファイルを選択してください。親への移動とシンボリックリンクは対象外です。</red>
