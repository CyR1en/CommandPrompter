# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - Migrer la syntaxe des invites V2 | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>Utilisation : /cmdp migrate [--dry-run] [path]. Chemins relatifs à plugins/ ; TAB complète les dossiers et fichiers. | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>Vous n’avez pas la permission de migrer des fichiers.</red>
command.migrate.started=<gray>Recherche d’invites anciennes dans %path%...</gray>
command.migrate.nothing=<yellow>Rien à migrer dans %path%. Aucune sauvegarde ni modification effectuée.</yellow>
command.migrate.manual=<yellow>%count% problème(s) nécessitent une vérification manuelle. Le fichier est inchangé. Affichage de 20 problèmes maximum :</yellow>
command.migrate.preview=<gray>%count% invite(s) seraient migrées dans %path%. Aucun fichier écrit. Affichage de 20 modifications maximum :</gray>
command.migrate.change=<gray>Ligne %line% : %before% → %after%</gray>
command.migrate.success=<green>%count% invite(s) migrées dans %path%.</green>
command.migrate.backup=<gray>Sauvegarde : %path%</gray>
command.migrate.reload=<gray>Rechargez le plugin auquel appartient cette configuration lorsque vous êtes prêt.</gray>
command.migrate.issue.malformed=<red>Ligne %line% : Invite ancienne non fermée ou mal formée.</red>
command.migrate.issue.ambiguous=<red>Ligne %line% : Syntaxe ou échappement ambigu ; convertissez cette invite manuellement.</red>
command.migrate.issue.unsupported=<red>Ligne %line% : Type d’invite, option ou filtre de joueurs ancien non pris en charge.</red>
command.migrate.issue.invalid=<red>Ligne %line% : L’invite convertie échoue à la validation V3 ; vérifiez-la manuellement.</red>
command.migrate.error.busy=<red>Ce fichier est déjà en cours de migration. Réessayez à la fin.</red>
command.migrate.error.not_found=<red>Le fichier sélectionné n’existe pas.</red>
command.migrate.error.unsupported_file=<red>Sélectionnez une configuration texte UTF-8 ; les fichiers binaires, sauvegardes et fichiers temporaires sont exclus.</red>
command.migrate.error.invalid_path=<red>Chemin invalide. Utilisez un fichier sous plugins/ ; les chemins parents, liens symboliques et sauvegardes de migration sont exclus.</red>
command.migrate.error.too_large=<red>Le fichier dépasse la limite de migration de 8 Mio.</red>
command.migrate.error.read_failed=<red>Impossible de lire le fichier. Vérifiez ses permissions et le journal du serveur.</red>
command.migrate.error.backup_failed=<red>Impossible de créer la sauvegarde. Le fichier original est inchangé. Consultez le journal du serveur.</red>
command.migrate.error.changed=<red>Le fichier a changé pendant la migration. Il n’a pas été remplacé ; réessayez après les autres écritures.</red>
command.migrate.error.write_failed=<red>Impossible de remplacer le fichier de façon atomique. L’original n’a pas été remplacé ; la sauvegarde est conservée. Consultez le journal du serveur.</red>
command.migrate.error.unexpected=<red>Échec de la migration. Consultez le journal du serveur avant de réessayer.</red>
command.migrate.undo.usage=<gray>Utilisation : /cmdp migrate undo [backup]. TAB parcourt migration-backups/. Restaure la sauvegarde choisie après avoir sauvegardé le fichier actuel.</gray>
command.migrate.undo.started=<gray>Restauration de la sauvegarde %path%...</gray>
command.migrate.undo.nothing=<yellow>%path% correspond déjà à cette sauvegarde. Aucune modification ni nouvelle sauvegarde.</yellow>
command.migrate.undo.success=<green>%path% restauré. Le contenu précédent a été sauvegardé.</green>
command.migrate.undo.hint=<gray>Pour restaurer cette sauvegarde : /cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>Chemin de sauvegarde invalide. Choisissez un fichier dans migration-backups/ avec TAB ; les chemins parents et liens symboliques sont exclus.</red>
