# CommandPrompter messages (fr_FR)
# All values support MiniMessage formatting tags.
# To override, copy this file to plugins/CommandPrompterPaper/locales/messages_fr_FR.properties
# and edit as desired.

prompt.cancelled=<yellow>Prompt annulé.</yellow>
prompt.timed_out=<red>Le prompt a expiré.</red>
prompt.error.invalid_title_filter=<red>Configuration de prompt invalide : le filtre TITLE ne peut pas être utilisé sur une balise non composée.</red>
prompt.error.command_failed=<red>Échec de la commande : %message%</red>
validation.invalid_integer=<red>Veuillez entrer un entier valide.</red>
validation.invalid_string=<red>La saisie ne peut pas être vide.</red>
validation.answer_too_long=<red>La saisie dépasse la longueur maximale de %max% caractères.</red>
player_ui.search_instruction=<gold>Tapez votre terme de recherche dans le chat.</gold>
dialog.no_options=<yellow>Aucune option disponible, entrez l'argument manuellement.</yellow>
dialog.too_many_options=<yellow>Trop d'options (%count%), entrez l'argument manuellement.</yellow>
command.error.players_only=<red>Seuls les joueurs peuvent annuler les prompts.</red>
command.error.missing_preset=<red>Erreur de configuration : Un preset d'invite ou de post-commande est manquant. Consultez la console du serveur pour plus de détails.</red>
