# CommandPrompter messages (ko_KR)
# All values support MiniMessage formatting tags.
# To override, copy this file to plugins/CommandPrompterPaper/locales/messages_ko_KR.properties
# and edit as desired.

prompt.cancelled=<yellow>프롬프트가 취소되었습니다.</yellow>
prompt.timed_out=<red>프롬프트 시간이 초과되었습니다.</red>
prompt.error.invalid_title_filter=<red>잘못된 프롬프트 설정: TITLE 필터는 복합 태그가 아닌 태그에 사용할 수 없습니다.</red>
prompt.error.command_failed=<red>명령 실행에 실패했습니다: %message%</red>
validation.invalid_integer=<red>유효한 정수를 입력해 주세요.</red>
validation.invalid_string=<red>입력 내용은 비워 둘 수 없습니다.</red>
validation.answer_too_long=<red>입력 내용이 최대 길이(%max%자)를 초과했습니다.</red>
player_ui.search_instruction=<gold>채팅창에 검색어를 입력하세요.</gold>
dialog.no_options=<yellow>사용 가능한 옵션이 없습니다. 인수를 직접 입력해 주세요.</yellow>
dialog.too_many_options=<yellow>옵션이 너무 많습니다 (%count%개). 인수를 직접 입력해 주세요.</yellow>
command.error.players_only=<red>프롬프트를 취소할 수 있는 것은 플레이어뿐입니다.</red>
command.error.missing_preset=<red>구성 오류: 필요한 프롬프트 또는 포스트 명령 프리셋이 없습니다. 자세한 내용은 서버 콘솔을 확인하세요.</red>
command.error.missing_validator=<red>구성 오류: 알 수 없는 입력 유효성 검사기가 참조되었습니다. 자세한 내용은 서버 콘솔을 확인하세요.</red>
command.cancel.no_active_prompt=<red>현재 활성화된 프롬프트가 없습니다.</red>
command.delegate.unknown_permission=<red>알 수 없는 권한 키: %key%</red>
command.reload.success=<green>설정을 다시 불러왔습니다.</green>
command.reload.failed=<red>다시 불러오기에 실패했습니다: %error%</red>
command.version=<gold>CommandPrompterPaper v%version%</gold>

# V2 prompt migration
command.migrate.help=<gold>/cmdp migrate [--dry-run] [path] - V2 프롬프트 구문 마이그레이션 | /cmdp migrate undo [backup]</gold>
command.migrate.usage=<gold>사용법: /cmdp migrate [--dry-run] [path]. 경로는 plugins/ 기준이며 TAB으로 폴더와 파일을 자동 완성합니다. | /cmdp migrate undo [backup]</gold>
command.migrate.denied=<red>파일을 마이그레이션할 권한이 없습니다.</red>
command.migrate.started=<gray>%path%에서 이전 프롬프트 확인 중...</gray>
command.migrate.nothing=<yellow>%path%에 마이그레이션할 내용이 없습니다. 백업이나 변경을 하지 않았습니다.</yellow>
command.migrate.manual=<yellow>문제 %count%개를 수동으로 확인해야 합니다. 파일은 변경되지 않았습니다. 최대 20개 표시:</yellow>
command.migrate.preview=<gray>%path%의 프롬프트 %count%개를 마이그레이션할 예정입니다. 파일을 쓰지 않았습니다. 변경 사항 최대 20개 표시:</gray>
command.migrate.change=<gray>%line%행: %before% → %after%</gray>
command.migrate.success=<green>%path%의 프롬프트 %count%개를 마이그레이션했습니다.</green>
command.migrate.backup=<gray>백업: %path%</gray>
command.migrate.reload=<gray>준비되면 이 설정을 소유한 플러그인을 다시 로드하세요.</gray>
command.migrate.issue.malformed=<red>%line%행: 이전 프롬프트가 닫히지 않았거나 형식이 잘못되었습니다.</red>
command.migrate.issue.ambiguous=<red>%line%행: 구문 또는 이스케이프가 모호합니다. 수동으로 변환하세요.</red>
command.migrate.issue.unsupported=<red>%line%행: 지원하지 않는 이전 프롬프트 유형, 옵션 또는 플레이어 필터입니다.</red>
command.migrate.issue.invalid=<red>%line%행: 변환한 프롬프트가 V3 검증에 실패했습니다. 수동으로 확인하세요.</red>
command.migrate.error.busy=<red>이 파일은 이미 마이그레이션 중입니다. 완료 후 다시 시도하세요.</red>
command.migrate.error.not_found=<red>선택한 파일이 없습니다.</red>
command.migrate.error.unsupported_file=<red>UTF-8 텍스트 설정 파일을 선택하세요. 바이너리, 백업, 임시 파일은 제외됩니다.</red>
command.migrate.error.invalid_path=<red>잘못된 경로입니다. plugins/ 아래 파일을 사용하세요. 상위 경로 이동, 심볼릭 링크, 마이그레이션 백업은 제외됩니다.</red>
command.migrate.error.too_large=<red>파일이 마이그레이션 제한인 8 MiB를 초과합니다.</red>
command.migrate.error.read_failed=<red>파일을 읽을 수 없습니다. 권한과 서버 로그를 확인하세요.</red>
command.migrate.error.backup_failed=<red>백업을 만들 수 없습니다. 원본 파일은 변경되지 않았습니다. 서버 로그를 확인하세요.</red>
command.migrate.error.changed=<red>마이그레이션 중 파일이 변경되었습니다. 교체하지 않았습니다. 다른 쓰기가 끝난 후 다시 시도하세요.</red>
command.migrate.error.write_failed=<red>파일을 원자적으로 교체할 수 없습니다. 원본은 교체되지 않았으며 백업은 유지됩니다. 서버 로그를 확인하세요.</red>
command.migrate.error.unexpected=<red>마이그레이션에 실패했습니다. 다시 시도하기 전에 서버 로그를 확인하세요.</red>
command.migrate.undo.usage=<gray>사용법: /cmdp migrate undo [backup]. TAB으로 migration-backups/를 탐색합니다. 현재 파일을 먼저 백업한 후 선택한 백업을 복원합니다.</gray>
command.migrate.undo.started=<gray>백업 %path% 복원 중...</gray>
command.migrate.undo.nothing=<yellow>%path%는 이미 이 백업과 같습니다. 변경하거나 새 백업을 만들지 않았습니다.</yellow>
command.migrate.undo.success=<green>%path%를 복원했습니다. 이전 내용은 백업으로 저장되었습니다.</green>
command.migrate.undo.hint=<gray>이 백업 복원: /cmdp migrate undo %path%</gray>
command.migrate.undo.invalid_path=<red>잘못된 백업 경로입니다. TAB으로 migration-backups/ 내 파일을 선택하세요. 상위 경로 이동과 심볼릭 링크는 제외됩니다.</red>
